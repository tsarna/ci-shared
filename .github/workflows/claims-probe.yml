name: Claims probe

# TEMPORARY. Measures what job_workflow_ref actually looks like when the gate
# is called by COMMIT HASH rather than by tag, which is what every real caller
# does -- and which the IAM trust policy has to match exactly. Passing an empty
# `needs` is what reaches the preflight through a workflow_call (the gate's own
# condition then skips), and the preflight prints the claims.
#
# Delete once the trust policy has been narrowed and verified.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    uses: tsarna/ci-shared/.github/workflows/ci-gate.yml@43eda0c25a4cf455d8b98a2c2ba057444a5fa8dc
    with:
      needs: ''
